# Builds the Windows and Mac installers and publishes them to this repository's Releases.
#
# How to release: bump "version" in frontend/package.json, commit, then push a matching tag:
#   git tag v1.0.28 && git push origin v1.0.28
# Installed apps then see the new version (Windows installs it; Mac points to the download page).
#
# One-time setup (Settings -> Secrets and variables -> Actions -> Variables):
#   WEB_COLLECTOR_APP_URL = https://<your Vercel address>   (not a secret; the app opens this site)
# No other secrets are needed: uploads use the built-in GITHUB_TOKEN.
name: Release desktop app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: Check version and settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match frontend/package.json version $version. Bump the version first."
            exit 1
          fi
      - name: App address is set
        env:
          WEB_COLLECTOR_APP_URL: ${{ vars.WEB_COLLECTOR_APP_URL }}
        run: |
          if [ -z "$WEB_COLLECTOR_APP_URL" ]; then
            echo "::error::Set the WEB_COLLECTOR_APP_URL variable (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WEB_COLLECTOR_APP_URL: ${{ vars.WEB_COLLECTOR_APP_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run electron:publish

  mac:
    name: Mac installer
    needs: check
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WEB_COLLECTOR_APP_URL: ${{ vars.WEB_COLLECTOR_APP_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run electron:publish:mac

  publish:
    name: Publish the release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Turn the draft into the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
