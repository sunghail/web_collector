appId: com.webcollector.app
productName: Web Collector
copyright: Copyright 2026

directories:
  output: dist-installer
  buildResources: resources

artifactName: Web-Collector-Setup-${version}.${ext}

files:
  - dist-electron/**/*
  - "!node_modules/**/*"
  - node_modules/electron-updater/**/*
  - node_modules/electron-updater/node_modules/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/sax/**/*
  - node_modules/js-yaml/**/*
  - node_modules/argparse/**/*
  - node_modules/fs-extra/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/semver/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/tiny-typed-emitter/**/*

# The app opens the Web Collector site (see scripts/write-app-config.js), so no server,
# database keys or env files are packaged. Only icons ship as extra resources.
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

# One universal build runs on both Intel and Apple Silicon Macs.
# Not signed by Apple (identity "-"), so macOS shows a warning on first open and the app
# announces updates instead of installing them.
mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  icon: resources/icon.icns
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Web-Collector-${version}-mac.${ext}

# Installers and update files go to this repository's Releases.
# The release workflow uploads to a draft, then publishes it once Windows and Mac are both done.
publish:
  provider: github
  owner: sunghail
  repo: web_collector
  releaseType: draft

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Web Collector
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerSidebar: installer-sidebar.bmp
  uninstallerSidebar: installer-sidebar.bmp
